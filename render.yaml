services:
  - type: web
    name: frontier-tech-watchlist
    runtime: docker
    plan: starter            # a persistent disk needs a paid instance
    healthCheckPath: /healthz
    disk:
      name: watchlist-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: MAIL_TO
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: APP_URL
        sync: false
      - key: ADMIN_KEY
        generateValue: true
