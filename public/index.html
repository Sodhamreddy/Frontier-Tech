<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Frontier Tech Watchlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800&display=swap">
<script>try{const t=localStorage.getItem("ftw-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
/* Dashboard shell: sidebar + topbar + view. Every color is a token so light and dark stay in sync. */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel-2:#f8f9fb; --ink:#111827; --ink-2:#374151; --muted:#6b7280;
  --rule:#e8eaee; --rule-soft:#f1f2f5; --hover:#f4f5f7;
  --accent:#4f46e5; --accent-ink:#ffffff; --accent-soft:#eef2ff; --gpt:#9333ea; --gpt-soft:#f5ecff;
  --up:#059669; --up-soft:#e7f8f1; --down:#dc2626; --down-soft:#fdeeee; --warn:#b45309; --warn-soft:#fff6e5;
  --star:#f59e0b;
  --shadow:0 1px 2px rgba(17,24,39,.03);
  --shadow-lg:0 20px 40px -12px rgba(15,23,42,.25);
  --sans:"Mulish",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Mulish",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0e15; --panel:#111722; --panel-2:#0e141e; --ink:#e6e9ef; --ink-2:#c3cad6; --muted:#8a96a8;
  --rule:#1f2735; --rule-soft:#192130; --hover:#172030;
  --accent:#818cf8; --accent-ink:#0a0e15; --accent-soft:#1d1f45; --gpt:#c084fc; --gpt-soft:#2a1840;
  --up:#34d399; --up-soft:#0b2a20; --down:#f87171; --down-soft:#341416; --warn:#fbbf24; --warn-soft:#2e2410;
  --star:#fbbf24;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 24px 48px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0e15; --panel:#111722; --panel-2:#0e141e; --ink:#e6e9ef; --ink-2:#c3cad6; --muted:#8a96a8;
  --rule:#1f2735; --rule-soft:#192130; --hover:#172030;
  --accent:#818cf8; --accent-ink:#0a0e15; --accent-soft:#1d1f45; --gpt:#c084fc; --gpt-soft:#2a1840;
  --up:#34d399; --up-soft:#0b2a20; --down:#f87171; --down-soft:#341416; --warn:#fbbf24; --warn-soft:#2e2410;
  --star:#fbbf24;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 24px 48px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:16px;height:16px;flex:none}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--rule);display:flex;flex-direction:column;padding:18px 14px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--gpt));display:grid;place-items:center;color:#fff;flex:none}
.brand b{display:block;font-size:14.5px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav .lab{font:600 10.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:13.5px}
.nav a:hover{background:var(--hover);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav a svg{width:17px;height:17px;flex:none;opacity:.85}
.nav a .cnt{margin-left:auto;font:600 11px var(--mono);color:var(--muted);background:var(--panel-2);border:1px solid var(--rule);border-radius:999px;padding:1px 7px}
.nav a .cnt.hot{background:var(--down-soft);color:var(--down);border-color:transparent}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:12px 8px 0;border-top:1px solid var(--rule);font-size:12px;color:var(--muted)}
.side-foot .row{display:flex;justify-content:space-between;gap:8px}
.side-foot b{color:var(--ink-2);font-weight:600}
.iconbtn{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--rule);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.iconbtn:hover{background:var(--hover)}
.iconbtn svg{width:15px;height:15px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);padding:14px 28px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.top h1{font-size:19px;font-weight:700;letter-spacing:-.02em;margin:0}
.top .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.top .grow{flex:1 1 auto}
.search{position:relative;flex:0 1 260px;min-width:150px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.search input{width:100%;background:var(--panel);border:1px solid var(--rule);border-radius:9px;padding:8px 10px 8px 32px;font-size:13.5px}
.search input::placeholder{color:var(--muted)}
/* live search results under the box */
.search svg.i{position:static;transform:none;width:16px;height:16px;color:inherit}
.qres{position:absolute;top:calc(100% + 6px);left:0;width:max(100%,380px);z-index:30;background:var(--panel);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;max-height:min(460px,70vh);overflow-y:auto}
.qres .qh{display:flex;justify-content:space-between;padding:6px 10px 8px;font:700 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.qi{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px}
.qi:hover,.qi[aria-selected="true"]{background:var(--hover)}
.qi .qn{flex:1;min-width:0}
.qi .qn b{font:800 13.5px var(--sans);display:flex;align-items:center;gap:6px}
.qi .qn small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qi mark{background:color-mix(in srgb,var(--accent) 18%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.qi .qp{text-align:right}
.qi .qp small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.qres .qall{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;text-align:center;padding:10px;margin-top:4px;border-top:1px solid var(--rule-soft);color:var(--accent);font-weight:700;font-size:13px;border-radius:0 0 10px 10px}
.qres .qall:hover{background:var(--hover)}
.qres .qempty{padding:18px 12px;text-align:center;color:var(--muted);font-size:13px}
@media (max-width:760px){.qres{width:100%}}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none;white-space:nowrap}
.switch input{appearance:none;width:32px;height:18px;border-radius:999px;background:var(--rule);position:relative;cursor:pointer;margin:0;transition:background .15s;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked{background:var(--accent)}
.switch input.red:checked{background:var(--down)}
.switch input:checked::after{transform:translateX(14px)}
.switch input:disabled{opacity:.5;cursor:not-allowed}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:9px;padding:8px 14px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.55;cursor:not-allowed;filter:none}
.btn svg{width:16px;height:16px}
.btn.ghost{background:var(--panel);color:var(--ink-2);border-color:var(--rule)}
.btn.ghost:hover{background:var(--hover);filter:none}
.btn.danger{background:var(--down);border-color:var(--down);color:#fff}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.sm svg{width:14px;height:14px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status{flex-basis:100%;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;min-height:18px;flex-wrap:wrap}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--up);flex:none}
.status .dot.live{box-shadow:0 0 0 0 color-mix(in srgb,var(--up) 60%,transparent);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.status.err{color:var(--down)} .status.err .dot{background:var(--down);animation:none}
.status.busy .dot{background:var(--warn)}
.status .auto{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;background:var(--panel);border:1px solid var(--rule);font-size:11.5px;color:var(--ink-2);text-decoration:none}
.status .auto svg{width:12px;height:12px}

.view{padding:20px 28px 48px;display:flex;flex-direction:column;gap:16px;max-width:1440px;width:100%}

/* ---------- cards ---------- */
.card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px 6px;flex-wrap:wrap}
.card-h h2,.card-h h3{margin:0;font-size:14.5px;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.card-h h3 svg{width:17px;height:17px;color:var(--accent)}
.card-h p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.card-b{padding:8px 18px 18px}
.card-b.flush{padding:4px 0 6px}
.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));align-items:start}
.g-ov{grid-template-columns:minmax(0,3fr) minmax(0,2fr);align-items:start}
@media (max-width:1150px){.g-ov{grid-template-columns:1fr}}

.kpi{padding:12px 16px;display:flex;flex-direction:column;gap:3px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:7px}
.kpi .l .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.kpi .l .ic.down{background:var(--down-soft);color:var(--down)} .kpi .l .ic.up{background:var(--up-soft);color:var(--up)}
.kpi .l .ic svg{width:13px;height:13px}
.kpi .v{font:650 22px/1.2 var(--mono);letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .meter{height:6px;border-radius:999px;background:var(--up-soft);overflow:hidden;display:flex;margin-top:4px}
.kpi .meter i{display:block;height:100%}

.badge{display:inline-flex;align-items:center;gap:4px;font:600 11.5px/1 var(--mono);padding:4px 7px;border-radius:6px;white-space:nowrap}
.badge.up{background:var(--up-soft);color:var(--up)} .badge.down{background:var(--down-soft);color:var(--down)} .badge.flat{background:var(--panel-2);color:var(--muted)}
.tag{display:inline-block;font:600 10px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:4px;background:var(--down);color:#fff}
.tag.soft{background:var(--panel-2);color:var(--muted);border:1px solid var(--rule)}
.tag.ok{background:var(--up-soft);color:var(--up)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}

.alert{border-color:color-mix(in srgb,var(--down) 40%,var(--rule))}
.alert .card-h h2 svg{width:18px;height:18px;color:var(--down)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:var(--down-soft);color:var(--down);font:500 12.5px/1.2 var(--mono);border:0;cursor:pointer;text-decoration:none}
.chip b{color:var(--ink);font-weight:650}
.chip:hover{filter:brightness(.97)}
.more-chip{background:var(--panel-2);color:var(--accent);font-family:var(--sans);font-weight:600;border:1px dashed var(--rule)}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{font:500 12.5px/1 var(--sans);color:var(--ink-2);background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:7px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;text-decoration:none}
.pill .n{font:500 11px var(--mono);color:var(--muted)}
.pill:hover{background:var(--hover)}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.pill[aria-pressed="true"] .n{color:inherit;opacity:.7}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--rule);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- tables ---------- */
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:600 11px/1.2 var(--sans);color:var(--muted);text-align:right;padding:9px 10px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--panel-2)}
th:first-child,td:first-child{padding-left:18px}
th:last-child,td:last-child{padding-right:18px}
th.l,td.l{text-align:left}
th button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
th button .ar{font-size:10px;opacity:.35}
th[aria-sort] button{color:var(--accent)} th[aria-sort] button .ar{opacity:1}
td{padding:7px 10px;border-bottom:1px solid var(--rule-soft);text-align:right;vertical-align:middle;white-space:nowrap}
tbody tr[data-k]{cursor:pointer;transition:background-color .12s}
tbody tr[data-k]:hover td{background:var(--hover)}
tbody tr:last-child td{border-bottom:0}
tr.al td:first-child{box-shadow:inset 3px 0 0 var(--down)}
.stk{display:flex;align-items:center;gap:8px;min-width:0}
.av{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font:700 10px var(--mono);flex:none;letter-spacing:-.02em}
.stk .t{font:650 13px var(--mono);color:var(--ink);display:flex;align-items:center;gap:6px}
.stk .c{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.stk .note{font-size:11px;color:var(--warn);white-space:normal;max-width:220px;line-height:1.3}
.star{all:unset;cursor:pointer;width:22px;height:22px;display:grid;place-items:center;border-radius:6px;color:var(--muted);opacity:.45;flex:none}
.star svg{width:15px;height:15px}
.star:hover{opacity:1;background:var(--hover)}
.star[aria-pressed="true"]{color:var(--star);opacity:1}
.star[aria-pressed="true"] svg{fill:currentColor}
.star:focus-visible{outline:2px solid var(--accent)}
td .secs{display:block;white-space:normal;color:var(--muted);font-size:12.5px;line-height:1.35;min-width:110px;max-width:220px}
.chg{display:inline-flex;align-items:center;gap:10px;justify-content:flex-end}
.bar{width:54px;height:6px;position:relative;background:var(--rule-soft);border-radius:999px}
.bar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted);opacity:.5}
.bar i{position:absolute;top:0;bottom:0;border-radius:999px}
.bar i.up{background:var(--up)} .bar i.down{background:var(--down)}
svg.spark{display:block}
.mx{display:inline-flex;gap:3px;align-items:center}
.mx .d{width:10px;height:10px;border-radius:2px;background:var(--rule-soft);border:1px solid var(--rule)}
.mx .d.c{background:var(--accent);border-color:var(--accent)} .mx .d.g{background:var(--gpt);border-color:var(--gpt)}
.mx .gap{width:5px}
.lists b{font:650 14px var(--mono)} .lists span{font:12px var(--mono);color:var(--muted)}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--rule-soft);font-size:12.5px;color:var(--muted)}
.pager b{color:var(--ink);font-weight:600}
.pager-b{display:flex;gap:8px}

/* ---------- charts ---------- */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{fill:var(--muted);font:11.5px var(--sans)}
svg.chart text.v{font:600 11px var(--mono)}
svg.chart text.ink{fill:var(--ink-2);font-weight:500}
svg.chart .grid{stroke:var(--rule-soft)}
svg.chart .axis{stroke:var(--muted);opacity:.5}
svg.chart .thr{stroke:var(--down);stroke-dasharray:4 3;opacity:.8}
svg.chart g.hit{cursor:pointer}
svg.chart g.hit:hover rect.bg{fill:var(--hover)}
svg.chart g.hit:hover rect.br{filter:brightness(1.1)}
svg.chart rect.hb:hover{filter:brightness(1.12)}
svg.ix{cursor:crosshair;touch-action:pan-y}
svg.ix .guide{stroke:var(--muted);stroke-dasharray:3 3;opacity:0;transition:opacity .1s}
svg.ix .gdot{opacity:0;transition:opacity .1s}
svg.ix.hov .guide,svg.ix.hov .gdot{opacity:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.sw.c{background:var(--accent)} .sw.g{background:var(--gpt)} .sw.b{background:linear-gradient(135deg,var(--accent) 50%,var(--gpt) 50%)}
table.heat td.h{text-align:center;font:600 13px var(--mono);border:3px solid var(--panel);border-radius:8px;padding:12px 4px}
table.heat td.h small{display:block;font:400 10.5px var(--sans);color:var(--muted);margin-top:2px;white-space:normal;line-height:1.3}
table.heat th{text-align:center;background:none;border:0}
.mini td,.mini th{padding:8px 0}
.mini th:first-child,.mini td:first-child{padding-left:0}
.mini th:last-child,.mini td:last-child{padding-right:0}
.take{margin:0;font-size:13px;color:var(--ink-2);border-top:1px solid var(--rule-soft);padding-top:12px;margin-top:8px}
.mov{display:grid;grid-template-columns:1fr 1fr;gap:0}
.mov > div + div{border-left:1px solid var(--rule-soft)}
.mov table{table-layout:fixed}
.mov td{padding-top:7px;padding-bottom:7px}
.mov td:last-child{width:96px}
.mov .stk .c{max-width:100%}
.mov .av{width:26px;height:26px;font-size:9.5px}
.mov h4{margin:0;padding:10px 18px 4px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}

/* tooltip */
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--panel);padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.45;box-shadow:var(--shadow-lg);max-width:260px;opacity:0;transform:translateY(4px);transition:opacity .1s,transform .1s}
.tip.on{opacity:1;transform:none}
.tip b{font-weight:650} .tip .m{font-family:var(--mono)}
.tip .r{display:flex;justify-content:space-between;gap:14px}

/* animations: only on a view change, never on background polls */
@media (prefers-reduced-motion:no-preference){
  .anim .card{animation:fadeUp .35s ease both}
  .anim .g-kpi .card:nth-child(2){animation-delay:.03s} .anim .g-kpi .card:nth-child(3){animation-delay:.06s}
  .anim .g-kpi .card:nth-child(4){animation-delay:.09s} .anim .g-kpi .card:nth-child(5){animation-delay:.12s} .anim .g-kpi .card:nth-child(6){animation-delay:.15s}
  .anim svg.chart rect.gx{animation:growX .7s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box}
  .anim svg.chart rect.gx.l{transform-origin:left} .anim svg.chart rect.gx.r{transform-origin:right}
  .anim svg.chart rect.gy{animation:growY .7s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:bottom}
  .anim svg.chart .draw{stroke-dasharray:1;animation:draw 1s ease both}
  .drawer.on svg.chart .draw{stroke-dasharray:1;animation:draw .9s ease both}
}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes growX{from{transform:scaleX(0)}}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}

/* ---------- list picker (sectors, picks) ---------- */
.picker{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}

/* ---------- forms (settings, manage, dialogs) ---------- */
.form{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));align-items:start}

.ibtn{all:unset;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:7px;color:var(--muted)}

.toasts{position:fixed;z-index:60;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}

.toast svg{width:16px;height:16px;flex:none}
.toast.ok svg{color:#34d399} .toast.err svg{color:#f87171}
@media (prefers-reduced-motion:reduce){.drawer,.scrim,.dlg,.tip{transition:none}.toast{animation:none}}

.foot{color:var(--muted);font-size:12px;line-height:1.6;max-width:100ch}

  .tab{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;border-radius:10px;color:var(--muted);font:600 10.5px/1.1 var(--sans);position:relative;-webkit-tap-highlight-color:transparent;text-align:center}

/* ---------- clean look: Mulish, quieter colors, more air ---------- */

  // ---------- helpers ----------
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  const fmtPct=(v,d=2)=>v==null||!isFinite(v)?"—":(v>0?"+":v<0?"−":"")+Math.abs(v).toFixed(d)+"%";

  const dayLbl=d=>new Date(d+"T12:00:00Z").toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:"UTC"});

  const BL=(year)=>{const d=new Date(BENCH+"T12:00:00Z");return `${d.getUTCDate()} ${d.toLocaleDateString("en-US",{month:"short",timeZone:"UTC"})}${year?" "+d.getUTCFullYear():""}`};
  const svgI=(id,c="i")=>`<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[id]||""}</svg>`;
  const canEdit=()=>!!(S.settings&&(S.settings.canEdit||S.settings.needsKey));

  const stocks=()=>S.uni?.stocks||{};

  const sym=k=>stocks()[k]?.symbol||k;
  function curQ(){const a=S.latest,b=S.live; if(b&&b.prices&&(!a||Date.parse(b.asOf)>Date.parse(a.asOf))) return b; return a;}
  const benchP=k=>S.bench?.prices?.[k];

  function pct(k){const b=benchP(k),c=curP(k); if(b==null||c==null||!b) return null; return (c/b-1)*100;}
  function series(k){
    const out=[];
    for(const m of Object.keys(S.hist).sort()){const d=S.hist[m]?.days||{};for(const day of Object.keys(d).sort()){if(day<BENCH)continue;const v=d[day]?.[k];if(v!=null)out.push([day,v])}}

  function dayChg(k){const s=series(k); if(s.length<2) return null; const a=s[s.length-2][1],b=s[s.length-1][1]; return a?(b/a-1)*100:null;}
  let secOf={};

  const sinceOf=k=>{const b=S.alerts?.below; if(b&&!Array.isArray(b)&&b[k]) return b[k].since||null; return null;};

  function spark(k,w=72,h=24){

  }

  // ---------- rows, filters, sorting, tables ----------
  function rowOf(k,extra){return Object.assign({k,s:stocks()[k]||{symbol:k},p:pct(k),secs:(secOf[k]||[]).slice().sort()},extra||{})}
  function filt(rows){

  const COLS={
    stock:{h:"Stock",l:1,t:"s",get:r=>r.s.symbol,cell:r=>`<div class="stk">${starBtn(r.k)}${avatar(r.k)}<div style="min-width:0"><div class="t">${esc(r.s.symbol)} ${isNew(r.k)&&isBelow(r.p)?'<span class="tag">new</span>':""}</div><div class="c" title="${esc(r.s.name)}">${esc(r.s.name||"")}</div>${r.s.note?`<div class="note">${esc(r.s.note)}</div>`:""}</div></div>`},

    day:{h:"Day",t:"n",first:"asc",cls:"hide-sm hide-md",get:r=>dayChg(r.k),cell:r=>{const d=dayChg(r.k);return `<span class="num ${cls(d)}">${fmtPct(d)}</span>`}},
    since:{h:"Below since",t:"s",get:r=>sinceOf(r.k)||"",cell:r=>{const s=sinceOf(r.k);return `<span class="num" style="color:var(--muted)">${s?dayLbl(s):"—"}</span>`}},

  };
  const colH=c=>typeof c.h==="function"?c.h():c.h;
  function sortRows(rows){
    const c=ui.col&&COLS[ui.col]; if(!c) return rows;

    return rows.slice().sort((a,b)=>{const x=c.get(a),y=c.get(b);

  // ---------- consensus model ----------
  const TYPES=["Overall","Best Tech","Safest Bets","Extreme Profits"];

  let SLOTS=[];
  function consensus(){
    const picks=cats().filter(c=>c.family==="Claude picks"||c.family==="GPT picks");
    const typeOf=n=>TYPES.find(t=>n.toLowerCase().includes(t.toLowerCase()));
    const slots=[];
    for(const m of ["Claude","GPT"]) for(const t of TYPES) slots.push({m,t,c:picks.find(c=>c.family===m+" picks"&&typeOf(c.name)===t)||null});

    slots.forEach((sl,i)=>{if(!sl.c)return; sl.c.items.forEach(k=>{const r=map[k]||(map[k]={k,hits:slots.map(()=>false)}); r.hits[i]=true})});
    const max=slots.filter(s=>s.c).length;
    const rows=Object.values(map).filter(r=>stocks()[r.k]).map(r=>{const cN=r.hits.slice(0,4).filter(Boolean).length,gN=r.hits.slice(4).filter(Boolean).length;

  // ---------- charts (hover tooltips, crosshair, animated on view change) ----------
  const tipRow=(a,b)=>`<div class="r"><span>${a}</span><span class="m">${b}</span></div>`;
  function sectorChart(){

    if(!data.length) return '<div class="empty">No sector lists yet.</div>';
    const W=760,rowH=23,ml=160,mr=70,H=data.length*rowH+24;
    const m=Math.max(Math.abs(THR)+1,...data.map(d=>Math.abs(d.avg)));
    const X=v=>ml+(v+m)/(2*m)*(W-ml-mr);
    let g=`<line class="axis" x1="${X(0)}" x2="${X(0)}" y1="0" y2="${H-20}"/>`;
    g+=`<line class="thr" x1="${X(THR)}" x2="${X(THR)}" y1="0" y2="${H-20}"/><text x="${X(THR)}" y="${H-4}" text-anchor="middle" style="fill:var(--down)">${TT()}</text>`;
    g+=`<text x="${X(0)}" y="${H-4}" text-anchor="middle">0%</text>`;

      const y=i*rowH, x0=X(Math.min(0,d.avg)), w=Math.max(2,Math.abs(X(d.avg)-X(0))), c=d.avg>=0?"var(--up)":"var(--down)";
      const tip=`<b>${esc(d.name)}</b>${tipRow("Average",fmtPct(d.avg))}${tipRow("Names",d.n)}${tipRow("Up since "+BL(),d.up)}${tipRow("Below "+TT(),d.nb)}<div style="opacity:.7;margin-top:4px">Click to open</div>`;

  }
  function histChart(ps){
    const edges=[-Infinity,-30,-20,-15,-10,-5,0,5,10,15,20,30,Infinity];
    const lbl=["","−30","−20","−15","−10","−5","0","+5","+10","+15","+20","+30"];
    const bins=edges.slice(0,-1).map((lo,i)=>({lo,hi:edges[i+1],n:ps.filter(p=>p>=lo&&p<edges[i+1]).length}));
    const W=760,H=300,mb=26,mt=20,ml=8,mr=8,bw=(W-ml-mr)/bins.length,mx=Math.max(1,...bins.map(b=>b.n));
    let g="";
    bins.forEach((b,i)=>{
      const h=(b.n/mx)*(H-mb-mt), x=ml+i*bw, y=H-mb-h;
      const c=b.hi<=THR?"var(--down)":b.hi<=0?"color-mix(in srgb,var(--down) 45%,var(--muted))":"var(--up)";
      const range=i===0?"below −30%":i===bins.length-1?"above +30%":`${lbl[i]}% to ${lbl[i+1]}%`;
      const names=ps.length?`<b>${b.n} stock${b.n===1?"":"s"}</b> ${range}`:"";
      g+=`<rect class="hb gy" style="animation-delay:${i*30}ms" data-tip="${esc(names)}" x="${(x+3).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-6).toFixed(1)}" height="${Math.max(h,b.n?2:0).toFixed(1)}" rx="3" fill="${c}"/>`;
      if(b.n) g+=`<text class="v" x="${(x+bw/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle">${b.n}</text>`;
      if(i>0) g+=`<text x="${x.toFixed(1)}" y="${H-8}" text-anchor="middle">${lbl[i]}%</text>`;
    });
    let ti=edges.findIndex((e,i)=>i>0&&THR>=e&&THR<edges[i+1]); if(ti<1) ti=5;
    const tx=ml+ti*bw+(THR-edges[ti])/(edges[ti+1]-edges[ti])*bw;
    g+=`<line class="thr" x1="${tx.toFixed(1)}" x2="${tx.toFixed(1)}" y1="${mt-6}" y2="${H-mb}"/>`;
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Distribution of price changes">${g}</svg>`;
  }
  // Line chart with a hover crosshair: points are stored on the svg and read by the pointer handler.
  function lineSvg({W,H,pts,label,inner}){
    const data=pts.map(p=>[+p.x.toFixed(1),+p.y.toFixed(1),p.tip]);
    return `<svg class="chart ix" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}" data-pts="${esc(JSON.stringify(data))}">${inner}<line class="guide" x1="0" x2="0" y1="0" y2="${H-26}"/><circle class="gdot" r="5" fill="var(--panel)" stroke="var(--accent)" stroke-width="2.5"/></svg>`;
  }
  function trendChart(){
    const keys=Object.keys(stocks());
    const days=[];
    for(const m of Object.keys(S.hist).sort()){const d=S.hist[m]?.days||{};for(const day of Object.keys(d).sort()) if(day>=BENCH) days.push([day,d[day]])}
    const Q=curQ(); if(Q&&Q===S.live) days.push(["live",Q.prices]);
    const pts=days.map(([day,pr])=>{const ps=keys.map(k=>{const b=benchP(k),c=pr?.[k];return b&&c!=null?(c/b-1)*100:null}).filter(p=>p!=null);return {day,med:medOf(ps),nb:ps.filter(isBelow).length,up:ps.filter(p=>p>0).length,n:ps.length}}).filter(p=>p.med!=null);
    if(pts.length<2) return '<div class="empty">The trend appears after a few daily closes.</div>';
    const W=760,H=300,ml=44,mr=48,mt=14,mb=28;
    const lo=Math.min(THR-1,...pts.map(p=>p.med)),hi=Math.max(2,...pts.map(p=>p.med));
    const nbMax=Math.max(...pts.map(p=>p.nb),1);
    const X=i=>ml+i/(pts.length-1)*(W-ml-mr), Y=v=>mt+(hi-v)/(hi-lo)*(H-mt-mb), YB=n=>H-mb-(n/nbMax)*(H-mt-mb)*.55;
    const L=d=>d==="live"?"Live":dayLbl(d);
    let g="";
    const step=hi-lo>12?5:2;
    for(let t=Math.ceil(lo/step)*step;t<=hi;t+=step) g+=`<line class="grid" x1="${ml}" x2="${W-mr}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/><text x="${ml-6}" y="${(Y(t)+3).toFixed(1)}" text-anchor="end">${t>0?"+":""}${t}%</text>`;
    const bw=Math.min(22,(W-ml-mr)/pts.length*.5);
    pts.forEach((p,i)=>{g+=`<rect class="gy" style="animation-delay:${i*40}ms" x="${(X(i)-bw/2).toFixed(1)}" y="${YB(p.nb).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H-mb-YB(p.nb)).toFixed(1)}" rx="2" fill="var(--down)" opacity=".16"/>`});
    g+=`<line class="thr" x1="${ml}" x2="${W-mr}" y1="${Y(THR).toFixed(1)}" y2="${Y(THR).toFixed(1)}"/>`;
    g+=`<polyline class="draw" pathLength="1" points="${pts.map((p,i)=>X(i).toFixed(1)+","+Y(p.med).toFixed(1)).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>`;
    pts.forEach((p,i)=>{g+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.med).toFixed(1)}" r="3.2" fill="var(--panel)" stroke="var(--accent)" stroke-width="2"/>`;
      const every=Math.ceil(pts.length/7); if(i%every===0||i===pts.length-1) g+=`<text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${L(p.day)}</text>`;});
    const last=pts[pts.length-1];
    g+=`<text class="v" x="${(X(pts.length-1)+8).toFixed(1)}" y="${(Y(last.med)+4).toFixed(1)}" style="fill:var(--accent)">${fmtPct(last.med,1)}</text>`;
    const hp=pts.map((p,i)=>({x:X(i),y:Y(p.med),tip:`<b>${L(p.day)}</b>${tipRow("Median change",fmtPct(p.med))}${tipRow("Below "+TT(),p.nb)}${tipRow("Up / down",`${p.up} / ${p.n-p.up}`)}`}));
    return lineSvg({W,H,pts:hp,label:"Median change and number below the line, by day",inner:g})+
      `<div class="legend" style="margin-top:6px"><span><span class="sw" style="background:var(--accent)"></span>Median change vs ${BL()}</span><span><span class="sw" style="background:var(--down);opacity:.3"></span>Stocks below ${TT()}</span><span style="margin-left:auto">Hover for daily values</span></div>`;
  }
  function priceChart(k){
    let s=series(k); const b=benchP(k);
    if(ui.range!=="all") s=s.slice(-Number(ui.range));
    if(s.length<2) return '<div class="empty">Price history appears after the next daily close.</div>';
    const W=520,H=230,ml=48,mr=14,mt=12,mb=26, vals=s.map(x=>x[1]);
    let lo=Math.min(...vals,b??vals[0],(b??vals[0])*(1+THR/100)),hi=Math.max(...vals,b??vals[0]); const pad=(hi-lo)*.08||1; lo-=pad; hi+=pad;
    const X=i=>ml+i/(s.length-1)*(W-ml-mr), Y=v=>mt+(hi-v)/(hi-lo)*(H-mt-mb);
    const L=d=>d==="live"?"Live":dayLbl(d);
    let g="";
    for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4; g+=`<line class="grid" x1="${ml}" x2="${W-mr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="${ml-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end">${fmtP(v)}</text>`}
    if(b!=null){const tl=b*(1+THR/100);
      g+=`<line class="axis" stroke-dasharray="3 3" x1="${ml}" x2="${W-mr}" y1="${Y(b).toFixed(1)}" y2="${Y(b).toFixed(1)}"/><text x="${W-mr}" y="${(Y(b)-5).toFixed(1)}" text-anchor="end">${BL()} ${fmtP(b)}</text>`;
      g+=`<line class="thr" x1="${ml}" x2="${W-mr}" y1="${Y(tl).toFixed(1)}" y2="${Y(tl).toFixed(1)}"/><text x="${W-mr}" y="${(Y(tl)+12).toFixed(1)}" text-anchor="end" style="fill:var(--down)">${TT()} line ${fmtP(tl)}</text>`}
    const last=vals[vals.length-1], c=b==null||last>=b?"var(--up)":"var(--down)";
    const pts=vals.map((v,i)=>X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ");
    g+=`<polygon points="${X(0).toFixed(1)},${H-mb} ${pts} ${X(vals.length-1).toFixed(1)},${H-mb}" fill="${c}" opacity=".08"/>`;
    g+=`<polyline class="draw" pathLength="1" points="${pts}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round"/>`;
    s.forEach(([d],i)=>{const every=Math.ceil(s.length/6); if(i%every===0||i===s.length-1) g+=`<text x="${X(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${L(d)}</text>`});
    const hp=s.map(([d,v],i)=>{const prev=i?s[i-1][1]:null;return {x:X(i),y:Y(v),tip:`<b>${L(d)}</b>${tipRow("Price",fmtP(v))}${b?tipRow("vs "+BL(),fmtPct((v/b-1)*100)):""}${prev?tipRow("Day",fmtPct((v/prev-1)*100)):""}`}});
    return lineSvg({W,H,pts:hp,label:"Price history",inner:g});
  }
  // Tooltips: anything with data-tip, plus crosshair charts.
  const tip=$("tip");
  function showTip(html,x,y){

    if(L+r.width>innerWidth-8) L=x-r.width-14; if(T+r.height>innerHeight-8) T=y-r.height-14;

      const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
      const p=pt.matrixTransform(svg.getScreenCTM().inverse());
      let best=pts[0]; for(const q of pts) if(Math.abs(q[0]-p.x)<Math.abs(best[0]-p.x)) best=q;

  // ---------- API ----------
  function adminKey(){try{return localStorage.getItem("ftw-key")||""}catch(e){return ""}}
  async function api(method,url,body,retry){
    const headers={"Content-Type":"application/json"}; const k=adminKey(); if(k) headers["x-admin-key"]=k;
    const r=await fetch(url,{method,headers,body:body?JSON.stringify(body):undefined});
    const j=await r.json().catch(()=>({}));
    if(r.status===401&&S.settings?.needsKey&&!retry){ if(await askKey()) return api(method,url,body,true); }
    if(!r.ok) throw new Error(j.error||("HTTP "+r.status));

  }

        ok:"Save key",onOk:()=>{try{localStorage.setItem("ftw-key",$("keyInp").value.trim())}catch(e){} res(true)},onCancel:()=>res(false),focus:"keyInp"});

    }catch(e){
      console.warn("state",e);
      if(!S.uni){loadErr="Couldn't reach the watchlist server."; render(); setStatus("Data unavailable","err");}
      schedule();
    }
  }
  // Poll faster while auto-refresh is producing new prices.
  function schedule(){ clearTimeout(pollTimer); pollTimer=setTimeout(()=>load(),S.auto?.enabled&&S.auto?.marketOpen?20000:60000); }
  render(); load();
  document.addEventListener("visibilitychange",()=>{if(!document.hidden) load()});
})();
</script>
</body>
</html>
